<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>セットアップ</title>
  <style>
    :root {
      --bg: #f6f6f9;
      --card: #ffffff;
      --text: #22212b;
      --sub: #6b6a78;
      --line: #e3e2ea;
      --accent: #5b6ee1;
      --accent-text: #ffffff;
      --ok: #2f9e6b;
      --warn: #d9822b;
      --ng: #d94b5b;
      --muted: #a3a2ae;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17161d;
        --card: #211f29;
        --text: #eceaf3;
        --sub: #a19fae;
        --line: #33313d;
        --accent: #8496f0;
        --accent-text: #15141b;
        --muted: #6d6b78;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 24px 96px;
      background: var(--bg);
      color: var(--text);
      font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .lead { margin: 0 0 20px; color: var(--sub); }
    .item {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 4px 12px;
      margin-bottom: 12px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .dot {
      width: 14px;
      height: 14px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--muted);
    }
    .item[data-state="ok"] .dot { background: var(--ok); }
    .item[data-state="warn"] .dot { background: var(--warn); }
    .item[data-state="ng"] .dot { background: var(--ng); }
    .title { font-weight: 700; }
    .tag {
      margin-left: 6px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--sub);
      font-size: 11px;
      font-weight: 400;
    }
    .desc { grid-column: 2; color: var(--sub); }
    .actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .actions:empty { display: none; }
    button {
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button:disabled { opacity: 0.5; cursor: default; }
    .progress { grid-column: 2; display: none; margin-top: 6px; }
    .progress.on { display: block; }
    .bar { height: 6px; overflow: hidden; background: var(--line); border-radius: 3px; }
    .bar i { display: block; width: 0; height: 100%; background: var(--accent); transition: width 0.2s; }
    .progress small { color: var(--sub); }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      background: var(--bg);
      border-top: 1px solid var(--line);
    }
    footer .note { flex: 1; color: var(--sub); font-size: 12px; }
  </style>
</head>
<body>
  <h1>セットアップ</h1>
  <p class="lead">キャラと話すために必要なものを確認します。足りないものはボタンから準備できます。</p>

  <div id="items"></div>

  <footer>
    <span class="note" id="note"></span>
    <button id="recheck">再チェック</button>
    <button id="start" class="primary">はじめる</button>
  </footer>

  <script src="setup.js"></script>
</body>
</html>
