# v から始まるタグ（例: v0.2.0）を push すると、Windows と Mac のインストーラーを作って
# GitHub の Releases に置く。手動実行（Actions タブ → Run workflow）ならビルドだけして成果物を残す
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先にリリースを 1 つだけ作っておく。Windows と Mac のビルドがそれぞれ作ると、同じタグのリリースが 2 つできてしまう
  create-release:
    if: github.repository == 'mkosei/deskroid' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: create-release
    # 公開版のリポジトリでだけ動かす（非公開版から誤って配布しないように）。
    # 手動実行のときは create-release が飛ばされるので、失敗・取り消しでなければ動かす
    if: github.repository == 'mkosei/deskroid' && !failure() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore
