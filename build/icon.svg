<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Deskroid のアイコン：吹き出しの形をしたアンドロイドの頭（話すアンドロイド） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a5c"/>
      <stop offset="1" stop-color="#4b2a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5fe6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5fe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff3ff"/>
      <stop offset="1" stop-color="#2cc4f0"/>
    </linearGradient>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0d24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 土台 -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>

  <!-- アンテナ -->
  <line x1="512" y1="300" x2="512" y2="208" stroke="#dfe6ff" stroke-width="30" stroke-linecap="round"/>
  <circle cx="512" cy="188" r="44" fill="url(#eye)" filter="url(#eyeGlow)"/>

  <!-- 頭（左下にしっぽの付いた吹き出し） -->
  <g filter="url(#shadow)">
    <path d="M300 296 H724 A124 124 0 0 1 848 420 V624 A124 124 0 0 1 724 748 H452 L326 850 L346 748 H300 A124 124 0 0 1 176 624 V420 A124 124 0 0 1 300 296 Z" fill="url(#head)"/>
  </g>

  <!-- 顔のパネル -->
  <rect x="246" y="372" width="532" height="300" rx="120" fill="#1a1f45"/>

  <!-- 目 -->
  <g filter="url(#eyeGlow)">
    <rect x="352" y="452" width="96" height="140" rx="48" fill="url(#eye)"/>
    <rect x="576" y="452" width="96" height="140" rx="48" fill="url(#eye)"/>
  </g>
</svg>
